name: CI

on:
  push:
    branches:
      - master
  release:
    types: [released]
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Release
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          # Windows
          - { displayName: 32-bit Windows,
              rustTarget: i686-pc-windows-gnu,
              runner: 'ubuntu-latest' }

          - { displayName: 64-bit Windows,
              rustTarget: x86_64-pc-windows-gnu,
              runner: 'ubuntu-latest' }

          # Linux
          - { displayName: 32-bit Linux,
              rustTarget: i686-unknown-linux-gnu,
              debArch: i386,
              runner: 'ubuntu-22.04' }

          - { displayName: 64-bit Linux,
              rustTarget: x86_64-unknown-linux-gnu,
              debArch: amd64,
              runner: 'ubuntu-22.04' }

          - { displayName: ARM32 ARMv6 Linux,
              rustTarget: arm-unknown-linux-gnueabi,
              debArch: armel,
              runner: 'ubuntu-22.04' }

          - { displayName: ARM32 ARMv7 Linux,
              rustTarget: armv7-unknown-linux-gnueabihf,
              debArch: armhf,
              runner: 'ubuntu-22.04' }

          - { displayName: ARM64 Linux,
              rustTarget: aarch64-unknown-linux-gnu,
              debArch: arm64,
              runner: 'ubuntu-22.04' }

          # macOS
          - { displayName: 64-bit macOS,
              rustTarget: x86_64-apple-darwin,
              runner: 'macos-latest' }

          - { displayName: 64-bit macOS (Apple Silicon),
              rustTarget: aarch64-apple-darwin,
              runner: 'macos-latest' }

    runs-on: ${{ matrix.target.runner }}
    steps:
      # Get the machine ready to build
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Update apt-get package list
        if: ${{ contains(matrix.target.runner, 'ubuntu') }}
        run: sudo apt-get update

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target.rustTarget }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.7.10
        with:
          key: ${{ matrix.target.rustTarget }}

      - name: Add Windows Build Dependencies
        if: ${{ contains(matrix.target.rustTarget, 'pc-windows') }}
        run: sudo apt-get install -y gcc-mingw-w64

      - name: Add ARM32 Build Dependencies
        if: ${{ contains(matrix.target.rustTarget, 'arm') }}
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi gcc-arm-none-eabi binutils-arm-linux-gnueabi

      - name: Add ARM64 Build Dependencies
        if: ${{ contains(matrix.target.rustTarget, 'aarch64-unknown-linux') }}
        run: sudo apt-get install -y gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Add 32-bit Linux Build Dependencies
        if: ${{ contains(matrix.target.rustTarget, 'i686-unknown-linux-gnu') }}
        run: sudo apt-get install -y gcc-multilib

      # Build time
      - name: Build
        run: cargo build --release --target ${{ matrix.target.rustTarget }}

      - name: Upload Asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: httpbandwidthspeedtester-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}
          path: ./target/${{ matrix.target.rustTarget }}/release/httpbandwidthspeedtester${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}

      - name: Upload Release Asset
        if: github.event_name == 'release'
        id: upload-release-asset
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          cp ./target/${{ matrix.target.rustTarget }}/release/httpbandwidthspeedtester${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }} ./httpbandwidthspeedtester-${{ github.ref_name }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }} &&
          gh release upload ${{ github.event.release.tag_name }} ./httpbandwidthspeedtester-${{ github.ref_name }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}#"httpbandwidthspeedtester-${{ github.ref_name }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }} (${{ matrix.target.displayName }})"

      - name: Generate SHA-256 checksum for binary
        if: github.event_name == 'release'
        env:
          ASSET: httpbandwidthspeedtester-${{ github.ref_name }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "${ASSET}" > "${ASSET}.sha256"
          cat "${ASSET}.sha256"
          gh release upload ${{ github.event.release.tag_name }} --clobber "${ASSET}.sha256"

      - name: Build .deb package
        if: ${{ github.event_name == 'release' && matrix.target.debArch != '' }}
        run: |
          mkdir -p dpkg/DEBIAN dpkg/usr/bin
          cp ./target/${{ matrix.target.rustTarget }}/release/httpbandwidthspeedtester dpkg/usr/bin/
          chmod 755 dpkg/usr/bin/httpbandwidthspeedtester
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cat > dpkg/DEBIAN/control << EOF
          Package: httpbandwidthspeedtester
          Version: $VERSION
          Architecture: ${{ matrix.target.debArch }}
          Maintainer: richardsondev
          Description: HTTP bandwidth speed testing tool
          EOF
          sed -i 's/^          //' dpkg/DEBIAN/control
          dpkg-deb --build dpkg httpbandwidthspeedtester_${VERSION}_${{ matrix.target.debArch }}.deb

      - name: Upload .deb Release Asset
        if: ${{ github.event_name == 'release' && matrix.target.debArch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DEB="httpbandwidthspeedtester_${VERSION}_${{ matrix.target.debArch }}.deb"
          sha256sum "${DEB}" > "${DEB}.sha256"
          cat "${DEB}.sha256"
          gh release upload ${{ github.event.release.tag_name }} --clobber "${DEB}" "${DEB}.sha256"
